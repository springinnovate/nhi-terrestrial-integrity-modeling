# South Africa reference-condition analysis
#
# This TOML file is the complete analysis contract shared by the pipeline. Copy
# it to define another analysis, then edit the copy. Run all commands from the
# repository root and pass this file as the first positional argument.
# Each configuration section below explains when to change it, what its values
# mean, and which pipeline products must be regenerated. Comments are ignored when
# calculating configuration hashes, so documentation-only edits do not invalidate
# cached tiles, samples, models, or inference outputs.
#
# Typical workflow (PowerShell):
#
#   earthengine authenticate
#   python -m scripts.fetch_gee_raster_tiles `
#     config\south_africa_reference_condition_analysis.toml
#
#   python -m scripts.build_spatial_sample `
#     config\south_africa_reference_condition_analysis.toml
#
#   python -m scripts.fit_grassland_integrity_parameters `
#     config\south_africa_reference_condition_analysis.toml `
#     outputs\samples\south_africa_reference_condition_2018_spatial_sample.parquet
#
#   python -m scripts.apply_reference_condition_models `
#     config\south_africa_reference_condition_analysis.toml `
#     outputs\integrity_parameters\south_africa_reference_condition_2018_spatial_sample
#
# Data that goes into the pipeline:
#
# This project asks Earth Engine to build all configured variables as one ee.Image
# and downloads each spatial cache tile as one multiband GeoTIFF. This is only a
# project packaging convention: it keeps the aligned variables together instead of
# leaving dozens of separate raster files for every tile or AOI. The variables are
# not mathematically combined. Each band remains an independent raster layer with
# its own source dataset, units, missing values, and role in the analysis.
#
# The ordered [[bands]] tables below are the authoritative schema for that image.
# They define which data layers are included, their order and names, their analysis
# roles, and the Earth Engine sources they require. The computation key selects an
# implementation in fetch_gee_raster_tiles.py, so calculations remain Python code
# while this TOML controls which calculations make up this analysis's stack.
# Earth Engine evaluates every configured layer on the common output [grid], which
# gives every band the same CRS, pixel size, tile dimensions, and alignment.
#
# The fetch command writes these reusable multiband tiles and a cache manifest.
# build_spatial_sample reads that cache directly, clips every edge tile to this
# analysis's AOI, and processes one tile at a time. It does not require or create a
# monolithic AOI GeoTIFF. Raster inference reads the same validated tiles, writes
# incrementally into stitched AOI GeoTIFFs, and can resume from completed tiles.
#
# In this project, dNN means "data layer NN," not "physical band NN." The stable
# data-layer ID follows a variable into sample columns, model artifacts, reports,
# and inference outputs even if a smaller TOML stack puts it in another physical
# GeoTIFF position. The complete stack happens to place d01 in band 1, d02 in band
# 2, and so on. Using bNN would blur this distinction and would also break existing
# rasters and model artifacts, so the established dNN identifiers are retained.
#
# d01 is the reference-site data layer. It has role = "reference" and value 1 where
# the configured grassland persistence and low-human-impact criteria are met. It is
# evaluated throughout the cache tiles selected by the AOI without an ecoregion or
# grassland-potential boundary. Earth Engine masks d01 elsewhere. During sampling, a
# predictor-footprint pixel without d01=1 is class 0 (background); class 0 means "not
# selected as a reference site," not "known non-grassland."
#
# All relative local paths are resolved from this file's directory, not from the
# shell's current directory. Output paths remain operational command-line options.
# See each script's --help and README.md for those options and output details.

# -----------------------------------------------------------------------------
# Analysis identity and AOI
# -----------------------------------------------------------------------------
# Change this section when defining a new geographic analysis or data year. AOI
# changes reuse already cached overlapping tiles; year changes select another set of
# source observations and therefore another raster cache namespace.
#
# Values:
#   name: Stable, file-safe provenance identifier. Change it for a distinct analysis
#     so manifests and model metadata remain distinguishable. It does not label a
#     raster band or alter Earth Engine pixel calculations.
#   display_name: Human-readable label for reports and figures. Change it for the
#     audience; it does not alter fetched pixels.
#   aoi_path: Polygon or MultiPolygon in any single-layer GDAL-readable vector
#     dataset, such as GeoJSON, GeoPackage, or Shapefile. The layer must define
#     its CRS and the path is resolved relative to this file. It selects complete
#     Earth Engine cache tiles; it does not identify an ecoregion or decide which
#     pixels receive inference.
#   year: Calendar year used for d02-d39. d01 instead uses the reference period in
#     [stack]. The year must fall between minimum_year and maximum_year.
#
# The optional raster selecting inference pixels is configured under [inference].
[analysis]
name = "south_africa_reference_condition_2018"
display_name = "South Africa"
aoi_path = "aoi/south_africa.geojson"
year = 2018

# -----------------------------------------------------------------------------
# Earth Engine access and reusable local tile cache
# -----------------------------------------------------------------------------
# Change this section for another Google Cloud project, cache location, or network
# environment. These are access, storage, and transport settings; changing them does
# not change raster-effective identity when datasets and calculations are unchanged.
#
# Values:
#   project: Google Cloud project registered for Earth Engine and authorized for the
#     current credentials. Change it when running under another EE project.
#   cache_directory: Local root for tile GeoTIFFs and manifest.json, resolved
#     relative to this file. Move it for another disk or shared cache location.
#   request_timeout_seconds: Maximum socket wait for one synchronous computePixels
#     attempt. Increase for consistently slow successful requests; decrease to fail
#     sooner during outages. It must be greater than zero.
#   request_retry_count: Attempts after the first failed request. A value of 1 means
#     at most two total attempts per tile; 0 disables retries. Increase only for
#     transient failures because each retry delays detection of a sustained outage.
#
# Every completed tile is validated and recorded before the next request, so a
# failed run can resume from its valid cache entries.
[earth_engine]
project = "ecoshard-202922"
cache_directory = "../data/gee_raster_cache"
request_timeout_seconds = 360
request_retry_count = 1

# -----------------------------------------------------------------------------
# Raster-stack contract
# -----------------------------------------------------------------------------
# [stack], [grid], [reference], [datasets], and every ordered [[bands]] table
# together define the fetched multiband raster. Changes to any raster-effective
# setting create a different cache namespace.
#
# Change this section only when defining another stack family, changing verified
# temporal support, or changing one of the cross-band calculations. Most AOI users
# should change [analysis], [reference], or [inference] instead.
#
# Values:
#   name: Stable identifier for this family of band calculations. Change it only for
#     a conceptually different raster product, not for a new AOI or year.
#   version: Manual schema/implementation version. Increment it when Python code
#     changes pixel meaning in a way not otherwise represented by this TOML. Do not
#     increment it for an AOI, year, timeout, sampling, model, or inference change.
#   minimum_year and maximum_year: Inclusive years for which the complete d02-d39
#     stack has verified source coverage. Extend these only after checking every
#     configured dataset and calculation for the proposed years.
#   reference_start_year and reference_end_year: Inclusive d01 persistence period.
#     Grassland probability and scaled HII may fail in isolated years, but not in
#     two consecutive years anywhere in this period. Use at least two years.
#   era5_start_year: Earliest ERA5 year the rainfall-window calculation may request.
#     This is a source-availability guard, not a normal tuning parameter.
#   interannual_rainfall_window_years: Number of annual precipitation totals ending
#     in analysis.year used for d27's coefficient of variation. A larger value
#     represents longer-term variability and requests more years; the interval is
#     truncated at era5_start_year when necessary. For year 2018, the value 10 uses
#     annual totals from 2009 through 2018.
#   stream_upstream_area_threshold_km2: Minimum MERIT Hydro upstream drainage area
#     used to define a stream for d32. Lower values include smaller channels and
#     usually reduce distance-to-stream values; higher values retain major channels.
#     The value 25 treats cells draining at least 25 km2 as streams.
[stack]
name = "nhi_reference_condition"
version = 3
minimum_year = 2015
maximum_year = 2019
reference_start_year = 2001
reference_end_year = 2020
era5_start_year = 1979
interannual_rainfall_window_years = 10
stream_upstream_area_threshold_km2 = 25

# The cache uses one globally anchored equal-area grid so overlapping analyses can
# reuse complete tiles. Change this section only for a deliberate output-grid or
# performance redesign. Any change shifts cache identity and prevents reuse of tiles
# made on the previous grid.
#
# Values:
#   crs: Projected, meter-based output coordinate reference system. EPSG:6933 is a
#     global equal-area grid suitable for area-weighted sampling and reporting.
#   pixel_size_meters: Output pixel width and height. Smaller values increase tile
#     counts, storage, and computation and cannot recover detail absent from coarse
#     source products; larger values trade spatial detail for speed and storage.
#   tile_size_pixels: Width and height of each square cache tile. At 128 pixels and
#     500 m, a tile is 64 km square. Larger tiles mean fewer requests but larger,
#     slower failures; smaller tiles provide finer progress but create more files.
#   origin_x and origin_y: Projected coordinates anchoring all tile rows, columns,
#     and pixel boundaries. Leave them at zero unless matching an established grid;
#     changing either value shifts every cached pixel and defeats overlap reuse.
[grid]
crs = "EPSG:6933"
pixel_size_meters = 500
tile_size_pixels = 128
origin_x = 0
origin_y = 0

# These thresholds construct only d01, the reference-site band. Change them when the
# scientific definition of a reference site changes. Stricter thresholds usually
# produce fewer, less human-influenced reference pixels; looser thresholds increase
# coverage but may admit more altered conditions. Every change creates new raster
# cache identity because d01 changes. No ecoregion boundary participates in d01,
# and these thresholds do not clip response or predictor bands d02-d39.
#
# Values:
#   grassland_probability: Minimum annual natural/semi-natural grassland probability
#     on the source's 0-100 percentage scale. The annual test is >= this value and
#     must satisfy the persistence rule described under [stack]. The value 80 means
#     at least 80% probability; higher is stricter.
#   human_modification: Maximum accepted value from the static HMI image. The test
#     is <= this value, so 0.1 excludes pixels above 0.1 on the source index. Lower
#     values require less modification and are stricter.
#   human_influence: Maximum accepted annual HII after the code divides its annual
#     mean by 7000. The test is < 0.08 here and uses the same persistence rule;
#     lower values require less human influence and are stricter.
[reference]
grassland_probability = 80
human_modification = 0.1
human_influence = 0.08

# Dataset aliases keep Earth Engine IDs separate from band definitions. Change this
# section when an asset moves, a collection version is replaced, or a new band
# computation requires another source. Do not substitute a superficially similar
# dataset without checking the Python computation's expected source band names,
# temporal cadence, units, scale factors, and masks.
#
# Values are exact Earth Engine Image or ImageCollection asset IDs. The key on the
# left is a stable local alias used in each band's sources list. Every referenced
# alias must exist. Replacing any configured ID changes raster-effective identity
# and creates a new cache namespace; remove aliases that no configured band uses.
[datasets]
# d01 reference-site inputs.
grassland_probability = "projects/global-pasture-watch/assets/ggc-30m/v1/nat-semi-grassland_p"
human_modification = "projects/hm-30x30/assets/output/v20240801/HMv20240801_2022s_AA_300"
human_influence = "projects/HII/v1/hii"

# d02-d19 ecological-response inputs.
landsat_ndvi = "LANDSAT/COMPOSITES/C02/T1_L2_8DAY_NDVI"
modis_phenology = "MODIS/061/MCD12Q2"
short_vegetation_height = "projects/global-pasture-watch/assets/gsvh-30m/v1/short-veg-height_m"
modis_vegetation_cover = "MODIS/061/MOD44B"
modis_lai_fpar = "MODIS/061/MOD15A2H"
modis_productivity = "MODIS/061/MOD17A3HGF"

# d20-d39 abiotic/environmental predictor inputs.
era5_daily = "ECMWF/ERA5/DAILY"
era5_monthly = "ECMWF/ERA5/MONTHLY"
gridmet_drought = "GRIDMET/DROUGHT"
viirs_burned_area = "NASA/VIIRS/002/VNP64A1"
jrc_monthly_water = "JRC/GSW1_4/MonthlyHistory"
merit_hydro = "MERIT/Hydro/v1_0_1"
isric_soil_organic_carbon = "projects/soilgrids-isric/soc_mean"
gldas = "NASA/GLDAS/V021/NOAH/G025/T3H"
smap = "NASA/SMAP/SPL4SMGP/008"
modis_evapotranspiration = "MODIS/061/MOD16A2GF"
srtm_landforms = "CSP/ERGo/1_0/Global/SRTM_landforms"
alos_topographic_diversity = "CSP/ERGo/1_0/Global/ALOS_topoDiversity"

# The repeated [[bands]] tables below are the stack, not an independent catalog.
# Change them to add, remove, reorder, relabel, or reclassify a data layer. Use
# model.responses instead when the pixels should remain available but only a subset
# of response models should be fitted. Adding a new computation also requires an
# implementation registered in fetch_gee_raster_tiles.py.
#
# Their file order is the GeoTIFF band order. In this complete definition d01 is
# raster band 1, d02 is band 2, and so on through d39. The dNN value is the stable
# data-layer identity, however, and does not have to match its physical position in
# a reduced or reordered stack. Any edit changes raster-effective identity.
#
# Each band field has a specific purpose:
#   id: Stable dNN data-layer identifier used in raster descriptions, table columns,
#     models, and reports. Preserve an ID when the variable's meaning is unchanged.
#   computation: Registered Python Earth Engine calculation, not arbitrary code.
#     Change it only to another implemented computation with compatible sources.
#   suffix: Stable output-name suffix; year and id are prepended automatically.
#     Change it only when the variable meaning/name changes because downstream
#     GeoTIFF and Parquet column names will change.
#   display_name: Human-readable report and figure label; it does not change values.
#   role: "reference" is the binary d01 label, "response" is an ecological variable
#     modeled from reference pixels, and "predictor" is an abiotic model input. The
#     pipeline requires exactly one reference and one categorical predictor.
#   data_type: "binary", "continuous", or "categorical" interpretation. It controls
#     downstream treatment; categorical predictors are one-hot encoded rather than
#     passed through continuous spline terms.
#   sources: One or more aliases from [datasets] needed by the computation. This is
#     dependency/provenance metadata and must agree with the implementation.
#
# For example, d02 becomes y2018_d02_ndvi_95th_percentile_across for this analysis.

# Reference-site label: GeoTIFF band 1.
[[bands]]
id = "d01"
computation = "grassland_reference_sites"
suffix = "grassland_reference_sites"
display_name = "Grassland reference sites"
role = "reference"
data_type = "binary"
sources = [
  "grassland_probability",
  "human_modification",
  "human_influence",
]

