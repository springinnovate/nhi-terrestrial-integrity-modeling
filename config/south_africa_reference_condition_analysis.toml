# -----------------------------------------------------------------------------
# Spatial sampling
# -----------------------------------------------------------------------------
# Used by build_spatial_sample.py when it creates the Parquet sample directly from
# the validated Earth Engine tile cache. Pixels are grouped into globally anchored
# square blocks, then up to samples_per_class_per_block are retained separately for
# reference (d01=1) and background (not selected by d01) pixels in each block. The
# cap applies once even when a sampling block crosses cache-tile boundaries.
#
# Change this section to trade spatial representation and class balance against
# sample-table size and model runtime. It changes which rows are sampled but does not
# change or redownload Earth Engine pixels. Regenerate the Parquet table and refit
# models after changing any sampling value.
#
# Values:
#   block_size_meters: Width and height of each equal-area sampling block. The 25 km
#     default spreads samples across local areas. Smaller blocks can retain more rows
#     and finer spatial balance; larger blocks impose coarser balance and fewer caps.
#     Keep model.validation_block_size_meters an integer multiple of this value.
#   samples_per_class_per_block: Maximum retained pixels in each block, applied
#     separately to reference and background classes. The value 100 can retain up to
#     200 rows per block when both classes are present. Higher values enlarge the
#     table; lower values increase sampling weights and reduce within-block detail.
#   random_seed: Seed for reproducible within-block sampling. Keep it fixed to
#     reproduce a table; change it only to create an intentional alternative sample.
[sampling]
block_size_meters = 25000
samples_per_class_per_block = 100
random_seed = 42

# -----------------------------------------------------------------------------
# Reference-condition response models
# -----------------------------------------------------------------------------
# Used by fit_grassland_integrity_parameters.py. Whole validation blocks are held
# out in fold_count spatial folds. responses accepts stable response IDs such as
# ["d02", "d03", "d11"]; an empty list fits every band whose role is "response".
#
# Change this section when revising spatial validation, missing-data tolerance,
# model flexibility, regularization, or the responses to screen. Changes do not
# redownload pixels, but they require refitting models and regenerating diagnostics.
#
# Values:
#   fold_count: Number of spatial cross-validation folds. The value 5 trains five
#     validation models, each holding out one fold. More folds increase fitting cost
#     and leave smaller validation sets; fewer folds give coarser diagnostics. At
#     least two are required, and each fold needs adequate reference observations.
#   validation_block_size_meters: Width and height of blocks kept wholly within one
#     fold. The 100 km default joins each 4 by 4 group of 25 km sampling blocks.
#     Larger blocks reduce local leakage but produce fewer independent blocks. Keep
#     this an integer multiple of sampling.block_size_meters.
#   minimum_predictor_coverage: Minimum represented-area share with a defined value
#     for a predictor to be retained. At 0.80, a predictor must cover at least 80% of
#     sampled represented area. Higher values exclude incomplete predictors sooner.
#     The configured categorical predictor is required and cannot be screened out.
#   maximum_row_missing_fraction: Largest missing share among retained predictors
#     for a row to remain usable. At 0.20, no more than 20% may be missing; accepted
#     missing values are imputed from each fold's training rows. Higher values retain
#     more rows but rely more heavily on imputation.
#   spline_knot_count: Quantile knots for each continuous predictor's cubic spline.
#     More knots permit more nonlinear shape but add coefficients, data demands, and
#     overfitting risk; fewer knots impose simpler response curves. Minimum is 2.
#   minimum_response_coverage: Minimum represented usable-reference area with a
#     defined response. At 0.50, at least half must be defined or that response is
#     skipped. Higher values demand more complete response observations.
#   ridge_alpha: L2 penalty on fitted spline and category coefficients. Zero removes
#     ridge regularization; larger values shrink coefficients more strongly and can
#     stabilize noisy or collinear fits at the cost of additional bias.
#   responses: Ordered dNN response IDs to fit. [] selects every configured response.
#     Use a subset after diagnostics to reduce runtime without changing the raster.
#
# Coverage and missingness values are proportions strictly between 0 and 1.
[model]
fold_count = 5
validation_block_size_meters = 100000
minimum_predictor_coverage = 0.80
maximum_row_missing_fraction = 0.20
spline_knot_count = 6
minimum_response_coverage = 0.50
ridge_alpha = 1.0
responses = []

# -----------------------------------------------------------------------------
# Raster inference
# -----------------------------------------------------------------------------
# Used only by apply_reference_condition_models.py. The application mask belongs in
# this section rather than [analysis] because it selects prediction pixels; it does
# not define the AOI, fetched data, reference sites, samples, or fitted models. It is
# still part of this analysis TOML and therefore remains reproducible.
#
# Change this section for another assessment target, available memory/I/O profile,
# or covariance-stabilization assumption. These values do not change fetched pixels
# or fitted response models; rerun inference to regenerate raster outputs.
#
# Values:
#   application_mask_path: Optional raster resolved relative to this file. Only
#     defined first-band pixels exactly equal to 1 receive inference. Remove this key
#     to use every otherwise-eligible predictor-footprint pixel. Change it for a
#     different assessment extent or mask year. CRS, resolution, grid, and extent
#     may differ from the stack because nearest-neighbor alignment is windowed.
#   worker_count: Maximum cache tiles calculated concurrently. Increase it when
#     CPU and storage bandwidth are available; decrease it to reduce peak memory
#     and concurrent reads. Each worker can retain one tile's five result arrays.
#     GeoTIFF writes and checkpoint updates remain serialized for file safety.
#   window_size_pixels: Width and height of each square processing window. The value
#     256 processes at most 65,536 source pixels per window. Larger windows may
#     improve sequential I/O but use more memory; smaller windows lower peak memory
#     while increasing loop and file-I/O overhead. Each cache tile is checkpointed
#     only after all of its windows and output rasters are written. It does not
#     change results.
#   covariance_shrinkage: Fraction used to replace off-diagonal reference covariance
#     with zero before matrix inversion. At 0.10, inference uses 90% of the measured
#     covariance plus 10% of its diagonal-only form while preserving variances.
#     Increase it when response correlations make inversion unstable; decrease it
#     to retain more measured correlation when calibration is well supported. It
#     must be strictly between 0 and 1 and changes multivariate distance and P_i,
#     not the individual expected-response or standardized-deviation rasters.
[inference]
application_mask_path = "../data/grassland_mask_2018.tif"
worker_count = 4
window_size_pixels = 256
covariance_shrinkage = 0.10
