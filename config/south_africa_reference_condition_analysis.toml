[analysis]
name = "south_africa_reference_condition_2018"
display_name = "South Africa"
aoi_path = "aoi/south_africa.geojson"
year = 2018

[earth_engine]
project = "ecoshard-202922"
cache_directory = "../data/gee_raster_cache"

[stack]
name = "nhi_reference_condition"
version = 1
minimum_year = 2015
maximum_year = 2019
reference_start_year = 2001
reference_end_year = 2020
era5_start_year = 1979
interannual_rainfall_window_years = 10
stream_upstream_area_threshold_km2 = 25

[grid]
crs = "EPSG:6933"
pixel_size_meters = 500
tile_size_pixels = 128
origin_x = 0
origin_y = 0

[reference]
grassland_probability = 80
human_modification = 0.1
human_influence = 0.08

[sampling]
block_size_meters = 25000
samples_per_class_per_block = 100
random_seed = 42

[model]
fold_count = 5
validation_block_size_meters = 100000
minimum_predictor_coverage = 0.80
maximum_row_missing_fraction = 0.20
spline_knot_count = 6
minimum_response_coverage = 0.50
ridge_alpha = 1.0
responses = []

[inference]
# grassland_mask_path = "../data/masks/south_africa_current_grassland.tif"
window_size_pixels = 256
covariance_shrinkage = 0.10

[datasets]
maybe_grassland_ecoregions = "projects/ecoshard-202922/assets/nhi_assets/maybe_grassland_ecoregions_simplified_100m"
grassland_probability = "projects/global-pasture-watch/assets/ggc-30m/v1/nat-semi-grassland_p"
human_modification = "projects/hm-30x30/assets/output/v20240801/HMv20240801_2022s_AA_300"
human_influence = "projects/HII/v1/hii"
landsat_ndvi = "LANDSAT/COMPOSITES/C02/T1_L2_8DAY_NDVI"
modis_phenology = "MODIS/061/MCD12Q2"
short_vegetation_height = "projects/global-pasture-watch/assets/gsvh-30m/v1/short-veg-height_m"
modis_vegetation_cover = "MODIS/061/MOD44B"
modis_lai_fpar = "MODIS/061/MOD15A2H"
modis_productivity = "MODIS/061/MOD17A3HGF"
era5_daily = "ECMWF/ERA5/DAILY"
era5_monthly = "ECMWF/ERA5/MONTHLY"
gridmet_drought = "GRIDMET/DROUGHT"
viirs_burned_area = "NASA/VIIRS/002/VNP64A1"
jrc_monthly_water = "JRC/GSW1_4/MonthlyHistory"
merit_hydro = "MERIT/Hydro/v1_0_1"
isric_soil_organic_carbon = "projects/soilgrids-isric/soc_mean"
gldas = "NASA/GLDAS/V021/NOAH/G025/T3H"
smap = "NASA/SMAP/SPL4SMGP/008"
modis_evapotranspiration = "MODIS/061/MOD16A2GF"
srtm_landforms = "CSP/ERGo/1_0/Global/SRTM_landforms"
alos_topographic_diversity = "CSP/ERGo/1_0/Global/ALOS_topoDiversity"

[[bands]]
id = "d01"
computation = "grassland_reference_sites"
suffix = "grassland_reference_sites"
display_name = "Grassland reference sites"
role = "reference"
data_type = "binary"
sources = [
  "grassland_probability",
  "human_modification",
  "human_influence",
  "maybe_grassland_ecoregions",
]

[[bands]]
id = "d02"
computation = "ndvi_95th_percentile"
suffix = "ndvi_95th_percentile_across"
display_name = "NDVI 95th percentile"
role = "response"
data_type = "continuous"
sources = ["landsat_ndvi"]

[[bands]]
id = "d03"
computation = "ndvi_median"
suffix = "ndvi_50th_percentile_across"
display_name = "NDVI median"
role = "response"
data_type = "continuous"
sources = ["landsat_ndvi"]

[[bands]]
id = "d04"
computation = "growing_season_length_1"
suffix = "length_of_growing_season_1"
display_name = "Growing-season length 1"
role = "response"
data_type = "continuous"
sources = ["modis_phenology"]

[[bands]]
id = "d05"
computation = "growing_season_length_2"
suffix = "length_of_growing_season_2"
