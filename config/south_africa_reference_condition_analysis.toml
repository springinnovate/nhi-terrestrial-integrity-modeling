# -----------------------------------------------------------------------------
# Spatial sampling
# -----------------------------------------------------------------------------
# Used by load_ecoregion_geotiff.py when it creates the Parquet sample. Pixels are
# grouped into square blocks, then up to samples_per_class_per_block are retained
# separately for reference (d01=1) and background (d01=0) pixels in each block.
[sampling]
block_size_meters = 25000
samples_per_class_per_block = 100
random_seed = 42

# -----------------------------------------------------------------------------
# Reference-condition response models
# -----------------------------------------------------------------------------
# Used by fit_grassland_integrity_parameters.py. Whole validation blocks are held
# out in fold_count spatial folds. responses accepts stable response IDs such as
# ["d02", "d03", "d11"]; an empty list fits every band whose role is "response".
# Coverage values and maximum_row_missing_fraction are proportions from 0 to 1.
[model]
fold_count = 5
validation_block_size_meters = 100000
minimum_predictor_coverage = 0.80
maximum_row_missing_fraction = 0.20
spline_knot_count = 6
minimum_response_coverage = 0.50
ridge_alpha = 1.0
responses = []

# -----------------------------------------------------------------------------
# Raster inference
# -----------------------------------------------------------------------------
# Used only by apply_reference_condition_models.py. application_mask_path is
# optional: remove the key to use every otherwise-eligible raster pixel. When set,
# only defined first-band mask pixels exactly equal to 1 receive inference. The mask
# can use another CRS, resolution, grid, or extent and is aligned with nearest-
# neighbor resampling. It does not alter tile fetching, sampling, or model fitting.
#
# window_size_pixels bounds processing memory. covariance_shrinkage stabilizes the
# reference-departure covariance matrix and must be a proportion between 0 and 1.
[inference]
application_mask_path = "../data/grassland_mask_2018.tif"
window_size_pixels = 256
covariance_shrinkage = 0.10
