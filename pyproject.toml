[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nhi-terrestrial-integrity-modeling"
version = "0.1.0"
description = "Habitat condition from prepared raster inputs and reference sites"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "scikit-learn>=1.4",
    "shapely>=2.0",
]

[project.optional-dependencies]
earth-engine = ["earthengine-api>=1.7,<2"]

[project.urls]
Repository = "https://github.com/springinnovate/nhi-terrestrial-integrity-modeling"

[tool.setuptools]
packages = ["nhi_terrestrial_integrity_modeling.config"]
include-package-data = false
py-modules = [
    "nhi_terrestrial_integrity_modeling.analysis_config",
    "nhi_terrestrial_integrity_modeling.earth_engine_stack",
    "nhi_terrestrial_integrity_modeling.habitat_condition",
    "nhi_terrestrial_integrity_modeling.habitat_training",
    "nhi_terrestrial_integrity_modeling.prepared_rasters",
    "nhi_terrestrial_integrity_modeling.prepared_runner",
    "nhi_terrestrial_integrity_modeling.prepared_sampling",
    "nhi_terrestrial_integrity_modeling.spatial_sampling",
]

[tool.setuptools.package-dir]
nhi_terrestrial_integrity_modeling = "scripts"
"nhi_terrestrial_integrity_modeling.config" = "config"

[tool.setuptools.package-data]
"nhi_terrestrial_integrity_modeling.config" = ["south_africa_reference_condition_analysis.toml"]
